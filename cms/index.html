<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1b1f" media="(prefers-color-scheme: dark)">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://academic-homepage-traffic.xct714328058.workers.dev; base-uri 'none'; form-action 'none'">
  <title>访问后台</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <script src="/assets/theme.js?v=4"></script>
  <link rel="stylesheet" href="/assets/palette.css?v=1">
  <link rel="stylesheet" href="./admin.css?v=4">
  <script src="./admin.js?v=5" defer></script>
</head>
<body>
  <header class="mast"><div class="wrap mast-inner">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>访问后台</div>
    <div class="actions"><a class="button subtle" href="/">查看主页</a><button id="logout" hidden>退出登录</button></div>
  </div></header>
  <main class="wrap">
    <section id="login" class="login panel">
      <h1>管理员登录</h1>
      <form id="login-form" method="post">
        <label for="password">管理密码</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" spellcheck="false">
        <button class="primary" type="submit">登录</button>
      </form>
      <noscript>请启用 JavaScript 后登录。</noscript>
    </section>
    <div id="workspace" hidden>
      <nav class="sidebar" aria-label="后台导航">
        <button id="nav-traffic" type="button" aria-controls="dashboard" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19h18M6 15v-4m6 4V5m6 10V8"/></svg>流量监控
        </button>
        <button id="nav-settings" type="button" aria-controls="settings" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h5m5 0h6M4 17h9m5 0h2"/><circle cx="11.5" cy="7" r="2.5"/><circle cx="15.5" cy="17" r="2.5"/></svg>设置
        </button>
      </nav>
      <div class="work-area">
        <section id="dashboard">
          <div class="heading"><div><h1>访问概览</h1><p class="caption" id="period">近 7 天 · 北京时间</p></div><button id="refresh" class="subtle">刷新数据</button></div>
          <div class="metrics panel">
            <div><span>今日浏览量</span><strong id="today">—</strong></div>
            <div><span>近 7 天浏览量</span><strong id="week">—</strong></div>
            <div><span>独立 IP 数</span><strong id="ips">—</strong></div>
            <div><span>已知城市数</span><strong id="city-count">—</strong></div>
          </div>
          <div class="charts">
            <figure class="panel"><figcaption>每日浏览量</figcaption><ol id="trend"></ol></figure>
            <section class="panel city-panel"><h2>访问较多的城市</h2><ol id="cities"></ol><p id="city-empty" class="caption" hidden>暂无已知城市</p></section>
          </div>
          <section class="panel records">
            <div class="heading"><div><h2>访问明细</h2><p id="matches" class="caption" aria-live="polite"></p></div><span class="time-zone">北京时间</span></div>
            <form id="filters" method="post">
              <label>开始时间<input id="from" type="datetime-local" name="from"></label>
              <label>结束时间<input id="to" type="datetime-local" name="to"></label>
              <label>公网 IP<input id="ip" type="search" name="ip" placeholder="完整 IP 或片段" maxlength="64" autocomplete="off"></label>
              <label>城市<input id="city" type="search" name="city" placeholder="城市名称或片段" maxlength="100" autocomplete="off"></label>
              <div class="filter-actions"><button class="primary" type="submit">筛选</button><button id="clear" type="button">清除</button></div>
            </form>
            <table>
              <thead><tr><th scope="col">入库时间</th><th scope="col">公网 IP</th><th scope="col">推测位置</th><th scope="col">访问环境</th><th scope="col">来源网站</th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
            <div id="pager">
              <div class="size-picker"><span id="size-label">每页条数</span><div class="segments" role="group" aria-labelledby="size-label">
                <button data-size="20" aria-pressed="true">20</button><button data-size="50" aria-pressed="false">50</button><button data-size="100" aria-pressed="false">100</button>
              </div></div>
              <div class="page-controls"><button id="previous">上一页</button><span id="page-number">—</span><button id="next">下一页</button></div>
            </div>
          </section>
        </section>
        <section id="settings" hidden>
          <h1>设置</h1>
          <section class="panel password-panel" aria-labelledby="password-title">
            <h2 id="password-title">修改密码</h2>
            <form id="password-form" method="post">
              <label for="current-password">当前密码</label>
              <input id="current-password" name="current" type="password" autocomplete="current-password" required>
              <label for="new-password">新密码</label>
              <input id="new-password" name="new" type="password" autocomplete="new-password" aria-describedby="password-hint" required>
              <p id="password-hint" class="caption">6 至 128 个字符，可使用中文、空格和符号。</p>
              <label for="confirm-password">确认新密码</label>
              <input id="confirm-password" type="password" autocomplete="new-password" required>
              <p class="caption">保存后，所有设备都需要用新密码重新登录。</p>
              <button type="submit" class="primary">保存新密码</button>
            </form>
          </section>
        </section>
      </div>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
