<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://academic-homepage-traffic.xct714328058.workers.dev; base-uri 'none'; form-action 'none'">
  <title>访问后台 · 许辰涛</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./admin.css">
  <script src="./admin.js?v=2" defer></script>
</head>
<body>
  <header class="mast"><div class="wrap mast-inner">
    <a class="identity" href="/">许辰涛 <span>学术主页</span></a>
    <button id="logout" hidden>退出登录</button>
  </div></header>
  <main class="wrap">
    <section id="login" class="login">
      <h1>访问后台</h1>
      <form id="login-form" method="post">
        <label for="password">管理口令</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" spellcheck="false">
        <button class="primary" type="submit">登录</button>
      </form>
      <noscript>请启用 JavaScript 后登录。</noscript>
    </section>
    <section id="dashboard" hidden>
      <div class="heading"><h1>访问概览</h1><button id="refresh">刷新数据</button></div>
      <div class="overview">
        <div class="numbers">
          <div><span class="label">今日浏览量</span><strong id="today">—</strong></div>
          <div><span class="label">近 7 天浏览量</span><strong id="week">—</strong></div>
        </div>
        <figure><figcaption>每日浏览量</figcaption><ol id="trend"></ol></figure>
      </div>
      <div class="heading detail"><h2>访问明细</h2><span class="label">北京时间</span></div>
      <table>
        <thead><tr><th scope="col">访问时间</th><th scope="col">公网 IP</th><th scope="col">推测城市</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="pager" hidden><button id="previous">上一页</button><span id="page-number"></span><button id="next">下一页</button></div>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
