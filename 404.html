<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1b1f" media="(prefers-color-scheme: dark)">
  <title>Page Not Found · Chentao Xu</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="/assets/favicon.svg?v=2">
  <script src="/assets/theme.js?v=4"></script>
  <link rel="stylesheet" href="/assets/palette.css?v=4">
  <link rel="stylesheet" href="/assets/style.css?v=10">
  <script src="/assets/i18n.js?v=7" defer></script>
  <style>
    body { min-height: 100vh; display: grid; place-items: center; }
    main { max-width: 540px; padding: 32px; }
    h1 { color: var(--ink); font-size: 1.75rem; font-weight: 500; margin: 16px 0; }
    p { color: var(--muted); margin-bottom: 18px; }
    .error-code { font-size: 0.875rem; letter-spacing: 3px; margin-top: 25px; }
    .header-controls { margin: 0 0 25px; }
  </style>
</head>
<body data-page="not-found">
  <main>
    <div class="header-controls">
        <details class="settings-menu" hidden>
          <summary class="settings-toggle" aria-label="Settings" title="Settings"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><polygon points="12.00,4.00 13.95,2.19 15.83,2.76 16.44,5.35 17.66,6.34 20.31,6.44 21.24,8.17 19.85,10.44 20.00,12.00 21.81,13.95 21.24,15.83 18.65,16.44 17.66,17.66 17.56,20.31 15.83,21.24 13.56,19.85 12.00,20.00 10.05,21.81 8.17,21.24 7.56,18.65 6.34,17.66 3.69,17.56 2.76,15.83 4.15,13.56 4.00,12.00 2.19,10.05 2.76,8.17 5.35,7.56 6.34,6.34 6.44,3.69 8.17,2.76 10.44,4.15"/><circle cx="12" cy="12" r="3.2"/></svg></summary>
          <div class="settings-panel">
            <div class="settings-row">
              <span class="settings-label theme-label">Theme</span>
              <div class="theme-switch control-group" role="group" aria-label="Color theme">
                <button class="control-button theme-option" type="button" data-theme="system" aria-label="Follow system" aria-pressed="true" title="Follow system"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg></button>
                <button class="control-button theme-option" type="button" data-theme="light" aria-label="Light theme" aria-pressed="false" title="Light theme"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button>
                <button class="control-button theme-option" type="button" data-theme="dark" aria-label="Dark theme" aria-pressed="false" title="Dark theme"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13.1A9 9 0 0 1 10.9 3a9 9 0 1 0 10 10.1Z"/></svg></button>
              </div>
            </div>
            <div class="settings-row">
              <span class="settings-label font-size-label">Text size</span>
              <div class="font-size-switch control-group" role="group" aria-label="Text size">
                <button class="control-button font-size-option" type="button" data-font-size="large" aria-label="Large text" aria-pressed="false" title="Large text">L</button>
                <button class="control-button font-size-option" type="button" data-font-size="medium" aria-label="Medium text" aria-pressed="true" title="Medium text">M</button>
                <button class="control-button font-size-option" type="button" data-font-size="small" aria-label="Small text" aria-pressed="false" title="Small text">S</button>
              </div>
            </div>
          </div>
        </details>
      </div>
    <p class="error-code">404</p>
    <h1 data-i18n="notFound.title">Page not found</h1>
    <p data-i18n="notFound.description">This page may have moved, or the link may be incorrect.</p>
    <a href="/" data-i18n="notFound.home">Back to homepage</a>
  </main>
  <div class="floating-actions" role="group" aria-label="Page controls">
    <button class="floating-button floating-language-toggle" type="button" lang="zh-CN" aria-label="切换为中文" title="切换为中文" hidden><span class="floating-language-label">中</span></button>
  </div>
</body>
</html>
