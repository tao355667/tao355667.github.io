name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Prepare static files
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets _site/assets
          cp -R cms _site/cms
          for file in 404.html robots.txt sitemap.xml; do
            if [[ -f "$file" ]]; then
              cp "$file" _site/
            fi
          done

      - name: Enable homepage analytics
        if: vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN != ''
        env:
          SITE_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        shell: python
        run: |
          import json
          import os
          import re
          from pathlib import Path

          token = os.environ["SITE_TOKEN"].strip()
          if not re.fullmatch(r"[a-fA-F0-9]{32}", token):
              raise SystemExit("Expected the 32-character site token from the Web Analytics snippet.")

          page = Path("_site/index.html")
          html = page.read_text(encoding="utf-8")
          if html.count("</body>") != 1:
              raise SystemExit("Expected one closing body tag in the homepage.")
          config = json.dumps({"token": token, "spa": False})
          beacon = f"""<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{config}'></script>"""
          page.write_text(html.replace("</body>", f"  {beacon}\n</body>"), encoding="utf-8")

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
